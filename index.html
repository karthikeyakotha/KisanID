<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>naruto</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: black;
    }

    #v_src,
    #out {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: scaleX(-1);
    }

    #out {
      z-index: 2;
      pointer-events: none;
    }

    .darkness {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(10, 5, 0, 0.3);
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: 5;
    }

    .fx {
      position: absolute;
      height: auto;
      top: 0;
      left: 0;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
      mix-blend-mode: screen;
      z-index: 20;
    }

    #n {
      width: 1600px;
    }

    #s {
      width: 2400px;
    }
  </style>
</head>

<body>

  <video id="v_src" autoplay playsinline></video>
  <canvas id="out"></canvas>
  <div class="darkness"></div>

  <video id="n" class="fx" src="assets/naruto.mp4" playsinline preload="auto"></video>
  <video id="s" class="fx" src="assets/sasuke.mp4" playsinline preload="auto"></video>

  <audio id="n_audio" src="assets/naruto_sound.mp3" preload="auto"></audio>
  <audio id="s_audio" src="assets/sasuke_sound.mp3" preload="auto"></audio>

  <script>
    const vElement = document.getElementById('v_src');
    const cElement = document.getElementById('out');
    const ctx = cElement.getContext('2d');
    const n = document.getElementById('n');
    const s = document.getElementById('s');
    const n_audio = document.getElementById('n_audio');
    const s_audio = document.getElementById('s_audio');

    let pwr = [0, 0];
    let wasOpen = [false, false];

    function getHandSign(pts) {
      const wrist = pts[0];
      // Helper to check if a finger is extended
      const isExtended = (tipIdx, pipIdx) => {
        const tip = pts[tipIdx];
        const pip = pts[pipIdx];
        return Math.hypot(tip.x - wrist.x, tip.y - wrist.y) > Math.hypot(pip.x - wrist.x, pip.y - wrist.y);
      };

      const index = isExtended(8, 6);
      const middle = isExtended(12, 10);
      const ring = isExtended(16, 14);
      const pinky = isExtended(20, 18);

      // Simple heuristics for new jutsus
      if (index && middle && ring && pinky) return 'open';        // 4 fingers up -> Default/Rasengan
      if (index && middle && !ring && !pinky) return 'peace';     // 2 fingers up -> Shadow Clone
      if (index && !middle && !ring && !pinky) return 'point';    // 1 finger up -> Fireball
      if (!index && !middle && !ring && !pinky) return 'fist';    // 0 fingers up -> Chidori

      return 'none';
    }

    function onResults(res) {
      cElement.width = vElement.videoWidth;
      cElement.height = vElement.videoHeight;
      ctx.save();
      ctx.clearRect(0, 0, cElement.width, cElement.height);

      let fL = false;
      let fR = false;

      n.style.display = 'none';
      s.style.display = 'none';

      if (res.multiHandLandmarks && res.multiHandedness) {
        res.multiHandLandmarks.forEach((pts, i) => {
          const label = res.multiHandedness[i].label;
          const isR = label === 'Right';
          const idx = isR ? 1 : 0;

          // --- BRIGHT BLUE SKELETON ---
          ctx.save();
          ctx.shadowBlur = 10;
          ctx.shadowColor = '#00fbff';
          drawConnectors(ctx, pts, HAND_CONNECTIONS, { color: '#00d4ff', lineWidth: 3 });
          drawLandmarks(ctx, pts, { color: '#ffffff', lineWidth: 1, radius: 2 });
          ctx.restore();

          const sign = getHandSign(pts);
          const active = sign !== 'none';

          pwr[idx] += active ? 0.05 : -0.15;
          pwr[idx] = Math.max(0, Math.min(1, pwr[idx]));

          if (active && !wasOpen[idx]) {
            const vid = isR ? s : n;
            const aud = isR ? s_audio : n_audio;
            vid.currentTime = 0;
            vid.play().catch(() => { });
            aud.currentTime = 0;
            aud.play().catch(() => { });

            // You can use `sign` here to change the video SRC dynamically!
            // Example: if (sign === 'peace') vid.src = 'assets/shadow_clone.mp4';
          }
          wasOpen[idx] = active;

          const wrist = pts[0];
          const knk = pts[9];

          if (pwr[idx] > 0.01) {
            if (isR) {
              fR = true;
              const tx = (wrist.x + knk.x) / 2;
              const ty = (wrist.y + knk.y) / 2;
              s.style.left = `${(1 - tx) * window.innerWidth}px`;
              s.style.top = `${ty * window.innerHeight}px`;
              s.style.display = 'block';
              s.style.opacity = pwr[idx];
            } else {
              fL = true;
              const dx = knk.x - wrist.x;
              const dy = knk.y - wrist.y;
              const tx = knk.x + (dx * 0.8);
              const ty = knk.y + (dy * 0.8);
              n.style.left = `${(1 - tx) * window.innerWidth}px`;
              n.style.top = `${(ty * window.innerHeight) - 120}px`;
              n.style.display = 'block';
              n.style.opacity = pwr[idx];
            }
          }
        });
      }

      if (!fL) {
        pwr[0] = Math.max(0, pwr[0] - 0.15);
        if (pwr[0] > 0.01) { n.style.display = 'block'; n.style.opacity = pwr[0]; }
        wasOpen[0] = false;
      }
      if (!fR) {
        pwr[1] = Math.max(0, pwr[1] - 0.15);
        if (pwr[1] > 0.01) { s.style.display = 'block'; s.style.opacity = pwr[1]; }
        wasOpen[1] = false;
      }
      ctx.restore();
    }

    const h = new Hands({
      locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
    });

    h.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.65
    });

    h.onResults(onResults);

    const cam = new Camera(vElement, {
      onFrame: async () => { await h.send({ image: vElement }); },
      width: 1280, height: 720
    });

    const startOverlay = document.createElement('div');
    startOverlay.style.cssText = 'position:absolute;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.9);color:#0df;display:flex;align-items:center;justify-content:center;font-size:36px;font-family:sans-serif;z-index:9999;cursor:pointer;text-shadow: 0 0 10px #0df;';
    startOverlay.innerText = 'Click anywhere to enable Sound and Start';
    document.body.appendChild(startOverlay);

    startOverlay.addEventListener('click', () => {
      startOverlay.style.display = 'none';
      n.play().then(() => n.pause()).catch(() => { });
      s.play().then(() => s.pause()).catch(() => { });
      n_audio.play().then(() => n_audio.pause()).catch(() => { });
      s_audio.play().then(() => s_audio.pause()).catch(() => { });
      cam.start();
    });
  </script>
</body>

</html>
